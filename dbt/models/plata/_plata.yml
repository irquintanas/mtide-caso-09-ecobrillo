version: 2
models:
  - name: stg_parte
    description: "El parte diario limpio, con las dos entregas"
    columns:
      - name: servicio
        data_tests: [unique, not_null]
      - name: operario
        data_tests: [not_null]
      - name: tipo_lavado
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["exterior express", "completo", "interior", "tapicería", "detailing premium", "moto", "SUV", "flota de empresa"]
